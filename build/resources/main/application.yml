spring:
  application:
    name: cardocs-backend
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

carsxe:
  base-url: ${CARSXE_BASE_URL:https://api.carsxe.com}
  api-key: ${CARSXE_API_KEY:}

cardocs:
  security:
    api-key: ${CARDOCS_API_KEY:}

aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb:
    table-name: ${CARDOCS_DYNAMODB_TABLE:cardocs-develop}
