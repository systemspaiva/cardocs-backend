spring:
  application:
    name: cardocs-backend
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v1/swagger/api-docs
  swagger-ui:
    path: /v1/swagger
    disable-swagger-default-url: true
    display-request-duration: true

carsxe:
  base-url: ${CARSXE_BASE_URL:https://api.carsxe.com}
  api-key: ${CARSXE_API_KEY:}

cardocs:
  security:
    api-key: ${CARDOCS_API_KEY:}
    cognito:
      region: ${CARDOCS_COGNITO_REGION:${AWS_REGION:us-east-1}}
      user-pool-id: ${CARDOCS_COGNITO_USER_POOL_ID:}
      app-client-id: ${CARDOCS_COGNITO_APP_CLIENT_ID:}

aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb:
    table-name: ${CARDOCS_DYNAMODB_TABLE:cardocs-develop}
